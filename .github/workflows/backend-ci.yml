name: backend-ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Django backend checks and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cdee
          POSTGRES_USER: cdee
          POSTGRES_PASSWORD: cdee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cdee -d cdee"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: cdee
      POSTGRES_USER: cdee
      POSTGRES_PASSWORD: cdee
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      CHANNEL_LAYER_REDIS_URL: redis://127.0.0.1:6379/3
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/dev.txt
            backend/requirements/prod.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements/dev.txt

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U cdee -d cdee; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Enable pgvector in primary database
        env:
          PGPASSWORD: cdee
        run: |
          psql -h 127.0.0.1 -p 5432 -U cdee -d cdee -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Enable pgvector in template1 for Django test database creation
        env:
          PGPASSWORD: cdee
        run: |
          psql -h 127.0.0.1 -p 5432 -U cdee -d template1 -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run Django system checks
        working-directory: backend
        run: |
          python manage.py check

      - name: Run backend test suite
        working-directory: backend
        run: |
          pytest