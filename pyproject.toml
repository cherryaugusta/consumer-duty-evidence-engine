[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = '''
/(
    .venv
  | frontend
  | backend/.*/migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  ".venv",
  "frontend",
  "backend/**/migrations",
]

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["apps", "config"]
skip_glob = ["backend/**/migrations/*.py"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["backend/tests"]
